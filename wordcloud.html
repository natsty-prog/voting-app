<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כלי AI בלמידה</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #e8eef5;
    color: #2D3436;
    direction: rtl;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(135deg, #003366 0%, #004a94 100%);
    color: white;
    padding: 28px 40px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(0,51,102,0.3);
  }
  header h1 { font-size: 1.6em; font-weight: 700; line-height: 1.4; }

  .main {
    display: flex;
    flex: 1;
    gap: 28px;
    padding: 32px 28px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  /* ===== LEFT: input panel ===== */
  .panel-input {
    background: white;
    border-radius: 16px;
    padding: 30px 28px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    border-top: 5px solid #ED6C44;
    width: 320px;
    flex-shrink: 0;
    height: fit-content;
  }
  .panel-input h2 {
    font-size: 1.05em;
    color: #003366;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  #word-input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 1em;
    font-family: inherit;
    direction: rtl;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 10px;
  }
  #word-input:focus { border-color: #003366; }
  #submit-btn {
    width: 100%;
    background: #003366;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 1em;
    font-family: inherit;
    cursor: pointer;
    font-weight: 700;
    transition: background 0.2s;
    letter-spacing: 0.03em;
  }
  #submit-btn:hover { background: #004a94; }
  #submit-btn:disabled { background: #aaa; cursor: not-allowed; }
  #feedback-msg {
    margin-top: 10px;
    font-size: 0.88em;
    min-height: 18px;
    color: #8FA93A;
    font-weight: 600;
  }
  #feedback-msg.error { color: #ED6C44; }

  /* ===== RIGHT: results panel ===== */
  .panel-results {
    flex: 1;
    background: white;
    border-radius: 16px;
    padding: 30px 32px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .results-header h3 {
    color: #003366;
    font-size: 1.1em;
    font-weight: 700;
  }
  #live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #FFF5F2;
    border: 1px solid #ED6C44;
    color: #ED6C44;
    font-size: 0.75em;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
  }
  #live-dot {
    width: 8px; height: 8px;
    background: #ED6C44;
    border-radius: 50%;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.7); }
  }

  /* ===== BARS ===== */
  #bars-list { display: flex; flex-direction: column; gap: 14px; }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slide-in 0.35s ease;
  }
  @keyframes slide-in {
    from { opacity:0; transform:translateX(16px); }
    to   { opacity:1; transform:translateX(0); }
  }

  .bar-rank {
    width: 24px;
    text-align: center;
    font-weight: 700;
    color: #888;
    font-size: 0.95em;
    flex-shrink: 0;
  }
  .bar-label {
    width: 120px;
    flex-shrink: 0;
    font-size: 0.95em;
    font-weight: 600;
    color: #2D3436;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: right;
  }
  .bar-track {
    flex: 1;
    background: #eef0f3;
    border-radius: 6px;
    height: 36px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    min-width: 30px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-left: 10px;
  }
  .bar-count {
    font-size: 0.85em;
    font-weight: 800;
    color: white;
  }

  #empty-msg {
    color: #aaa;
    text-align: center;
    padding: 40px 0;
    font-size: 1em;
  }
  #total-count {
    margin-top: 20px;
    text-align: left;
    font-size: 0.85em;
    color: #999;
  }
  #total-count strong { color: #003366; }

  /* Bar colours — cycle through course palette */
  .bar-c0 { background: #003366; }
  .bar-c1 { background: #ED6C44; }
  .bar-c2 { background: #004a94; }
  .bar-c3 { background: #8FA93A; }
  .bar-c4 { background: #D84315; }
  .bar-c5 { background: #6E862D; }
  .bar-c6 { background: #1a5276; }
  .bar-c7 { background: #b5451b; }

  @media (max-width: 720px) {
    .main { flex-direction: column; padding: 20px 16px; }
    .panel-input { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>מהם כלי הבינה המלאכותית הכי שימושיים לכם בלמידה?</h1>
</header>

<div class="main">

  <div class="panel-input">
    <h2>כתבו כלי AI אחד שאתם משתמשים בו 👇</h2>
    <input id="word-input" type="text" placeholder="לדוגמה: ChatGPT, Gemini..." maxlength="40" autocomplete="off" />
    <button id="submit-btn" onclick="submitWord()">שלח</button>
    <div id="feedback-msg"></div>
  </div>

  <div class="panel-results">
    <div class="results-header">
      <h3>תוצאות הכיתה</h3>
      <span id="live-badge"><span id="live-dot"></span>Live</span>
    </div>
    <div id="bars-list"><div id="empty-msg">ממתין לתשובות ראשונות...</div></div>
    <div id="total-count"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCYoy6J3gcLg8zKUSg2YLtiaq2KCltW8LM",
    authDomain: "voting-app-f0bc1.firebaseapp.com",
    databaseURL: "https://voting-app-f0bc1-default-rtdb.firebaseio.com",
    projectId: "voting-app-f0bc1",
    storageBucket: "voting-app-f0bc1.firebasestorage.app",
    messagingSenderId: "463010222207",
    appId: "1:463010222207:web:149f0cf2b4857b4d67af4a"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const wordsRef = ref(db, "wordcloud/ai-tools");

  /* ── render bars ── */
  function renderBars(data) {
    const list = document.getElementById("bars-list");
    const totalEl = document.getElementById("total-count");

    if (!data) {
      list.innerHTML = '<div id="empty-msg">ממתין לתשובות ראשונות...</div>';
      totalEl.innerHTML = "";
      return;
    }

    const counts = {};
    Object.values(data).forEach(w => {
      const key = w.trim().toLowerCase();
      if (key) counts[key] = (counts[key] || 0) + 1;
    });

    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const total = entries.reduce((s, [,v]) => s + v, 0);
    const max = entries[0]?.[1] || 1;

    if (entries.length === 0) {
      list.innerHTML = '<div id="empty-msg">ממתין לתשובות ראשונות...</div>';
      totalEl.innerHTML = "";
      return;
    }

    list.innerHTML = "";
    entries.forEach(([word, count], i) => {
      const pct = Math.max(5, Math.round((count / max) * 100));
      const colorClass = `bar-c${i % 8}`;

      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `
        <div class="bar-rank">${i + 1}.</div>
        <div class="bar-label">${escHtml(word)}</div>
        <div class="bar-track">
          <div class="bar-fill ${colorClass}" style="width:${pct}%">
            <span class="bar-count">${count}</span>
          </div>
        </div>`;
      list.appendChild(row);
    });

    totalEl.innerHTML = `סה"כ תשובות: <strong>${total}</strong>`;
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  /* ── live listener ── */
  onValue(wordsRef, snap => renderBars(snap.val()));

  /* ── submit ── */
  window.submitWord = async function () {
    const input = document.getElementById("word-input");
    const btn   = document.getElementById("submit-btn");
    const msg   = document.getElementById("feedback-msg");
    const word  = input.value.trim();

    if (!word) { showMsg("נא לכתוב כלי AI לפני השליחה", true); return; }

    btn.disabled = true;
    try {
      await push(wordsRef, word);
      input.value = "";
      showMsg("✓ תשובתך נשמרה!", false);
      setTimeout(() => { msg.textContent = ""; msg.className = ""; }, 3000);
    } catch (e) {
      showMsg("שגיאה בשמירה — בדקי חיבור לאינטרנט", true);
      console.error(e);
    } finally {
      btn.disabled = false;
      input.focus();
    }
  };

  function showMsg(text, isError) {
    const msg = document.getElementById("feedback-msg");
    msg.textContent = text;
    msg.className = isError ? "error" : "";
  }

  document.getElementById("word-input").addEventListener("keydown", e => {
    if (e.key === "Enter") window.submitWord();
  });
</script>
</body>
</html>
