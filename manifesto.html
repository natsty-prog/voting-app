<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אמנת ה-AI שלנו - המגילה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCYoy6J3gcLg8zKUSg2YLtiaq2KCltW8LM",
            authDomain: "voting-app-f0bc1.firebaseapp.com",
            projectId: "voting-app-f0bc1",
            storageBucket: "voting-app-f0bc1.firebasestorage.app",
            messagingSenderId: "463010222207",
            appId: "1:463010222207:web:149f0cf2b4857b4d67af4a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.manifestoApp = {
            db, auth,
            collectionRef: collection(db, 'sessions', 'ai-manifesto', 'entries')
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&family=Amatic+SC:wght@700&family=Varela+Round&display=swap');

        :root {
            --primary-blue: #003366;
            --secondary-blue: #004a94;
            --accent-orange: #ED6C44;
            --bg-light: #F3F6F9;
            --ink-color: #1a2a3a;
        }

        body {
            background-color: var(--bg-light);
            background-image: radial-gradient(circle at 20% 20%, rgba(0, 51, 102, 0.03) 0%, transparent 50%);
            font-family: 'Assistant', sans-serif;
            color: var(--ink-color);
            margin: 0;
            padding-bottom: 50px;
        }

        .scroll-title {
            font-family: 'Amatic SC', cursive;
            font-size: 5rem;
            color: var(--primary-blue);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* Scroll Visual Structure */
        .scroll-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            filter: drop-shadow(0 15px 30px rgba(0, 51, 102, 0.15));
        }

        /* Wooden Rods */
        .wood-rod {
            height: 32px;
            background: linear-gradient(180deg, #6b3a1f 0%, #3d1f0a 40%, #6b3a1f 100%);
            border-radius: 16px;
            position: relative;
            z-index: 30;
            width: 104%;
            margin-right: -2%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,200,100,0.2);
        }

        .wood-rod::before, .wood-rod::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 52px;
            height: 52px;
            background: radial-gradient(circle at 35% 35%, #d4a843, #8b5e1a 60%, #3d1f0a);
            border-radius: 50%;
            border: 4px solid #3d1f0a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .wood-rod::before { left: -20px; }
        .wood-rod::after { right: -20px; }

        /* Parchment Body — sepia */
        .scroll-paper {
            background-color: #f2e0b6;
            background-image:
                url("https://www.transparenttextures.com/patterns/paper-fibers.png"),
                linear-gradient(180deg, #e0c98a 0%, #f2e0b6 8%, #ecdcaa 50%, #f2e0b6 92%, #e0c98a 100%);
            padding: 70px 50px;
            margin: -5px 8px;
            position: relative;
            z-index: 10;
            min-height: 450px;
            border-left: 1px solid rgba(100,60,10,0.15);
            border-right: 1px solid rgba(100,60,10,0.15);
        }

        .scroll-paper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: linear-gradient(to bottom, rgba(100,60,10,0.15), transparent);
            z-index: 11;
            pointer-events: none;
        }
        .scroll-paper::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50px;
            background: linear-gradient(to top, rgba(100,60,10,0.15), transparent);
            z-index: 11;
            pointer-events: none;
        }

        /* Entry Item */
        .scroll-entry {
            border-bottom: 1px dashed rgba(100,60,10,0.25);
            padding: 2.5rem 0;
            position: relative;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .scroll-entry:last-child { border-bottom: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signature {
            font-family: 'Assistant', sans-serif;
            font-weight: 700;
            color: #5c3310;
            font-size: 1.15rem;
        }

        .entry-text {
            font-size: 1.2rem;
            line-height: 1.85;
            color: #3d2005;
            font-style: italic;
            position: relative;
        }

        .entry-date {
            font-size: 0.75rem;
            color: rgba(100,60,10,0.45);
            letter-spacing: 0.05em;
        }

        /* Form Styling — original course colors */
        .form-section {
            background: white;
            border: 2px solid var(--primary-blue);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 5rem;
            box-shadow: 0 10px 25px rgba(0, 51, 102, 0.08);
        }

        .quill-input {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-family: 'Assistant', sans-serif;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .quill-input:focus {
            outline: none;
            border-color: var(--accent-orange);
            background: white;
            box-shadow: 0 0 0 3px rgba(237, 108, 68, 0.1);
        }

        .seal-button {
            background: var(--accent-orange);
            color: #fff;
            padding: 14px 50px;
            border-radius: 50px;
            font-weight: 800;
            box-shadow: 0 6px 15px rgba(237, 108, 68, 0.3);
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 1.05rem;
            font-family: 'Assistant', sans-serif;
        }

        .seal-button:hover {
            background: #d55b36;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(237, 108, 68, 0.4);
        }

        .seal-button:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-16">
            <h1 class="scroll-title">אמנת ה-AI הכיתתית</h1>
            <p class="text-xl font-medium text-[#003366]/80 italic">בונים יחד את עקרונות העבודה בעידן החדש</p>
        </header>

        <!-- Input Section -->
        <div class="form-section">
            <h2 class="text-2xl font-bold mb-8 text-[#003366] flex items-center">
                <span class="ml-3 text-3xl">✒️</span> חתמו על האמנה:
            </h2>
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-[#003366] mb-2">שם / כינוי:</label>
                    <input type="text" id="studentName" class="quill-input" placeholder="השם שתזינו יופיע באמנה">
                </div>
                <div>
                    <label class="block text-sm font-bold text-[#003366] mb-2">ה"אני מאמין" שלך (3-5 משפטים):</label>
                    <textarea id="manifestoText" rows="4" class="quill-input resize-none" placeholder="כיצד תשלבו AI בלימודים ובקריירה תוך שמירה על יושרה ואתיקה?"></textarea>
                </div>
                <div class="flex justify-center pt-6">
                    <button id="submitBtn" class="seal-button">חתימה על האמנה 📜</button>
                </div>
            </div>
        </div>

        <!-- The Scroll -->
        <div class="scroll-wrapper">
            <div class="wood-rod"></div>
            <div id="scrollContent" class="scroll-paper">
                <div id="loading" class="py-24 text-center italic text-[#003366]/40 text-xl font-medium">
                    פורס את דברי החוכמה...
                </div>
            </div>
            <div class="wood-rod"></div>
        </div>
    </div>

    <!-- Success Overlay -->
    <div id="successOverlay" class="fixed inset-0 bg-[#003366]/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white p-12 rounded-3xl text-center shadow-2xl max-w-sm border-t-8 border-[#ED6C44]">
            <div class="text-7xl mb-8">🖋️</div>
            <h3 class="text-3xl font-bold text-[#003366] mb-4">החתימה נקלטה בהצלחה!</h3>
            <p class="text-lg text-[#003366]/70 mb-10">דבריך נוספו לאמנה המשותפת של הכיתה.</p>
            <button onclick="document.getElementById('successOverlay').classList.add('hidden'); document.getElementById('successOverlay').classList.remove('flex')"
                class="w-full bg-[#ED6C44] text-white py-3 px-10 rounded-xl font-bold text-lg hover:bg-[#d55b36] transition-colors">
                סגירה וחזרה
            </button>
        </div>
    </div>

    <script type="module">
        import { onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const { auth, collectionRef } = window.manifestoApp;

        const submitBtn       = document.getElementById('submitBtn');
        const scrollContent   = document.getElementById('scrollContent');
        const loadingEl       = document.getElementById('loading');
        const studentNameInput = document.getElementById('studentName');
        const manifestoTextInput = document.getElementById('manifestoText');
        const successOverlay  = document.getElementById('successOverlay');

        let user = null;

        signInAnonymously(auth).catch(console.error);

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) startListening();
        });

        function startListening() {
            onSnapshot(collectionRef, (snapshot) => {
                loadingEl.style.display = 'none';
                const docs = snapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
                renderManifesto(docs);
            }, console.error);
        }

        function formatDate(ts) {
            if (!ts) return '';
            return new Date(ts.seconds * 1000).toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function renderManifesto(items) {
            scrollContent.innerHTML = '';

            if (items.length === 0) {
                scrollContent.innerHTML = `
                    <div class="py-24 text-center italic text-lg" style="color:rgba(100,60,10,0.35);">
                        המגילה עדיין חלקה... המתינו לחותם הראשון.
                    </div>`;
                return;
            }

            items.forEach((item, index) => {
                const entry = document.createElement('div');
                entry.className = 'scroll-entry';
                entry.innerHTML = `
                    <p class="entry-text">"${item.text}"</p>
                    <div class="flex justify-between items-center mt-3">
                        <span class="signature">— ${item.name}</span>
                        <span class="entry-date">${formatDate(item.createdAt)} &nbsp;·&nbsp; #${index + 1}</span>
                    </div>`;
                scrollContent.appendChild(entry);
            });
        }

        submitBtn.addEventListener('click', async () => {
            const name = studentNameInput.value.trim();
            const text = manifestoTextInput.value.trim();

            if (!name || !text) {
                alert('אנא מלאו את כל השדות לפני החתימה.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'חותם... ✒️';

            try {
                await addDoc(collectionRef, {
                    name,
                    text,
                    uid: user.uid,
                    createdAt: serverTimestamp()
                });
                studentNameInput.value = '';
                manifestoTextInput.value = '';
                successOverlay.classList.remove('hidden');
                successOverlay.classList.add('flex');
            } catch (err) {
                console.error(err);
                alert('תקלה בחיבור למגילה. נסו שוב.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'חתימה על האמנה 📜';
            }
        });
    </script>
</body>
</html>
