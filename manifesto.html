<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אמנת ה-AI הכיתתית</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCYoy6J3gcLg8zKUSg2YLtiaq2KCltW8LM",
      authDomain: "voting-app-f0bc1.firebaseapp.com",
      projectId: "voting-app-f0bc1",
      storageBucket: "voting-app-f0bc1.firebasestorage.app",
      messagingSenderId: "463010222207",
      appId: "1:463010222207:web:149f0cf2b4857b4d67af4a"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    const col  = collection(db, 'sessions', 'ai-manifesto', 'entries');

    window._manifestoApp = { auth, db, col, addDoc, onSnapshot, serverTimestamp, signInAnonymously, onAuthStateChanged };
  </script>

  <style>
    body {
      background: #2c1e0f;
      background-image: radial-gradient(ellipse at center, #3d2a14 0%, #1a0f05 100%);
      font-family: 'Assistant', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .page-title {
      font-family: 'Amatic SC', cursive;
      font-size: 4.5rem;
      color: #d4a843;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      letter-spacing: 2px;
    }

    /* Scroll structure */
    .scroll-wrapper {
      max-width: 780px;
      margin: 0 auto;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
    }

    .wood-rod {
      height: 30px;
      background: linear-gradient(180deg, #6b3a1f 0%, #3d1f0a 40%, #6b3a1f 100%);
      border-radius: 15px;
      position: relative;
      z-index: 30;
      width: 106%;
      margin-right: -3%;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,220,150,0.2);
    }

    .wood-rod::before, .wood-rod::after {
      content: '';
      position: absolute;
      top: -12px;
      width: 54px;
      height: 54px;
      background: radial-gradient(circle at 35% 35%, #d4a843, #8b5e1a 60%, #3d1f0a);
      border-radius: 50%;
      border: 3px solid #3d1f0a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,220,150,0.3);
    }
    .wood-rod::before { left: -22px; }
    .wood-rod::after  { right: -22px; }

    /* Parchment */
    .scroll-paper {
      background-color: #f5e6c8;
      background-image:
        url("https://www.transparenttextures.com/patterns/paper-fibers.png"),
        linear-gradient(180deg, #e8d5a8 0%, #f5e6c8 8%, #f0ddb8 50%, #f5e6c8 92%, #e8d5a8 100%);
      padding: 60px 55px;
      margin: -4px 10px;
      position: relative;
      z-index: 10;
      border-left: 1px solid rgba(100,60,10,0.15);
      border-right: 1px solid rgba(100,60,10,0.15);
      min-height: 400px;
    }

    .scroll-paper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to bottom, rgba(100,60,10,0.12), transparent);
      pointer-events: none;
    }
    .scroll-paper::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to top, rgba(100,60,10,0.12), transparent);
      pointer-events: none;
    }

    /* Entry */
    .scroll-entry {
      border-bottom: 1px dashed rgba(100,60,10,0.2);
      padding: 2rem 0;
      animation: inkIn 0.7s ease-out forwards;
    }
    .scroll-entry:last-child { border-bottom: none; }

    @keyframes inkIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .entry-text {
      font-size: 1.15rem;
      line-height: 1.9;
      color: #3d2005;
      font-style: italic;
    }

    .entry-name {
      font-weight: 700;
      color: #6b3a1f;
      font-size: 1.05rem;
      font-style: normal;
    }

    .entry-date {
      font-size: 0.75rem;
      color: rgba(100,60,10,0.45);
      letter-spacing: 0.05em;
    }

    /* Form */
    .form-card {
      max-width: 780px;
      margin: 0 auto 3.5rem;
      background: linear-gradient(135deg, #fdf3dd, #f5e6c8);
      border: 2px solid rgba(139,94,26,0.35);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,220,150,0.4);
    }

    .parchment-input {
      width: 100%;
      background: rgba(255,250,235,0.8);
      border: 1px solid rgba(139,94,26,0.3);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-family: 'Assistant', sans-serif;
      color: #3d2005;
      transition: all 0.3s;
      box-sizing: border-box;
    }
    .parchment-input:focus {
      outline: none;
      border-color: #d4a843;
      background: #fffbee;
      box-shadow: 0 0 0 3px rgba(212,168,67,0.15);
    }
    .parchment-input::placeholder { color: rgba(100,60,10,0.4); }

    .seal-btn {
      background: linear-gradient(135deg, #d4a843, #b8892a);
      color: #3d1f0a;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 13px 50px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
      transition: all 0.3s;
      font-family: 'Assistant', sans-serif;
    }
    .seal-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .seal-btn:disabled { background: #8a7a60; cursor: not-allowed; transform: none; }

    .label-text {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #6b3a1f;
      margin-bottom: 6px;
    }

    /* Success overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(28,14,5,0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .overlay.show { display: flex; }
    .overlay-card {
      background: linear-gradient(135deg, #fdf3dd, #f5e6c8);
      border: 2px solid rgba(212,168,67,0.5);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="max-w-4xl mx-auto">

    <!-- Header -->
    <header class="text-center mb-12">
      <h1 class="page-title">אמנת ה-AI הכיתתית</h1>
      <p class="text-[#d4a843]/70 text-lg italic mt-2">בונים יחד את עקרונות העבודה בעידן החדש</p>
    </header>

    <!-- Form -->
    <div class="form-card">
      <h2 style="color:#6b3a1f; font-size:1.5rem; font-weight:700; margin-bottom:1.5rem;">
        ✒️ חתמו על האמנה
      </h2>
      <div style="display:flex; flex-direction:column; gap:1.2rem;">
        <div>
          <label class="label-text">שם / כינוי:</label>
          <input type="text" id="studentName" class="parchment-input" placeholder="השם שיופיע על המגילה" />
        </div>
        <div>
          <label class="label-text">ה"אני מאמין" שלך (3-5 משפטים):</label>
          <textarea id="manifestoText" rows="4" class="parchment-input" style="resize:none;" placeholder="כיצד תשלבו AI בלימודים ובקריירה תוך שמירה על יושרה ואתיקה?"></textarea>
        </div>
        <div style="text-align:center; padding-top:0.5rem;">
          <button id="submitBtn" class="seal-btn">חתימה על האמנה 📜</button>
        </div>
      </div>
    </div>

    <!-- Scroll -->
    <div class="scroll-wrapper">
      <div class="wood-rod"></div>
      <div id="scrollContent" class="scroll-paper">
        <div id="loadingMsg" style="text-align:center; padding:5rem 0; color:rgba(100,60,10,0.4); font-style:italic; font-size:1.1rem;">
          פורס את דברי החוכמה...
        </div>
      </div>
      <div class="wood-rod"></div>
    </div>

  </div>

  <!-- Success Overlay -->
  <div id="successOverlay" class="overlay">
    <div class="overlay-card">
      <div style="font-size:4rem; margin-bottom:1rem;">🖋️</div>
      <h3 style="color:#6b3a1f; font-size:1.8rem; font-weight:700; margin-bottom:0.75rem;">החתימה נקלטה!</h3>
      <p style="color:rgba(100,60,10,0.7); margin-bottom:2rem;">דבריך נוספו לאמנה המשותפת של הכיתה.</p>
      <button onclick="document.getElementById('successOverlay').classList.remove('show')"
        class="seal-btn" style="padding:12px 40px;">סגירה וחזרה</button>
    </div>
  </div>

  <script type="module">
    const { auth, col, addDoc, onSnapshot, serverTimestamp, signInAnonymously, onAuthStateChanged } = window._manifestoApp;

    const submitBtn      = document.getElementById('submitBtn');
    const scrollContent  = document.getElementById('scrollContent');
    const loadingMsg     = document.getElementById('loadingMsg');
    const nameInput      = document.getElementById('studentName');
    const textInput      = document.getElementById('manifestoText');
    const overlay        = document.getElementById('successOverlay');

    let currentUser = null;

    signInAnonymously(auth).catch(console.error);

    onAuthStateChanged(auth, (u) => {
      currentUser = u;
      if (u) listenToEntries();
    });

    function listenToEntries() {
      onSnapshot(col, (snap) => {
        loadingMsg.style.display = 'none';
        const items = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

        renderScroll(items);
      }, console.error);
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts.seconds * 1000);
      return d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function renderScroll(items) {
      scrollContent.innerHTML = '';

      if (items.length === 0) {
        scrollContent.innerHTML = `
          <div style="text-align:center; padding:5rem 0; color:rgba(100,60,10,0.35); font-style:italic; font-size:1.05rem;">
            המגילה עדיין חלקה... המתינו לחותם הראשון.
          </div>`;
        return;
      }

      items.forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'scroll-entry';
        el.innerHTML = `
          <p class="entry-text">"${item.text}"</p>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.75rem;">
            <span class="entry-name">— ${item.name}</span>
            <span class="entry-date">${formatDate(item.createdAt)} &nbsp;·&nbsp; #${i + 1}</span>
          </div>`;
        scrollContent.appendChild(el);
      });
    }

    submitBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!name || !text) {
        alert('אנא מלאו את כל השדות לפני החתימה.');
        return;
      }
      if (!currentUser) {
        alert('מתחבר... נסו שוב בעוד רגע.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'חותם... ✒️';

      try {
        await addDoc(col, {
          name,
          text,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });
        nameInput.value  = '';
        textInput.value  = '';
        overlay.classList.add('show');
      } catch (e) {
        console.error(e);
        alert('תקלה בחיבור. נסו שוב.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'חתימה על האמנה 📜';
      }
    });
  </script>

</body>
</html>
